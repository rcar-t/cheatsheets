<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>nano Keys</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #161a21;
    --line: #232934;
    --text: #c9d1dc;
    --muted: #7d8794;
    --key-bg: #222833;
    --key-line: #313948;
    --key-text: #e8edf3;
    --a: #7aa2f7; /* files */
    --b: #9ece6a; /* cut & paste */
    --c: #e0af68; /* undo & edit */
    --d: #bb9af7; /* delete */
    --e: #7dcfff; /* search */
    --f: #ff9e64; /* move */
    --g: #73daca; /* view & buffers */
    --h: #f7768e; /* tools */
    --l: #c0caf5; /* pico */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 11.5px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: 10px 16px 12px;
  }
  header {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  h1 { font-size: 14px; font-weight: 650; color: var(--key-text); letter-spacing: .2px; }
  header p { color: var(--muted); font-size: 11px; }
  main { columns: 16rem; column-gap: 18px; column-rule: 1px solid var(--line); }
  h2 {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px;
    color: var(--accent); padding: 2px 0 3px; margin: 0 0 2px;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    break-after: avoid;
  }
  section { break-inside: avoid; padding-bottom: 8px; }
  h2 small { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .row {
    display: grid; grid-template-columns: 6.6rem 1fr; column-gap: 8px; align-items: center;
    padding: 1px 0; break-inside: avoid;
  }
  .group {
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    border-radius: 5px;
    padding: 1px 4px; margin: 1px -4px;
    break-inside: avoid;
  }
  .keys { white-space: nowrap; display: flex; gap: 2px; align-items: center; }
  .label { min-width: 0; }
  kbd {
    font: 12.5px/1 "SF Mono", ui-monospace, Menlo, monospace;
    color: var(--key-text);
    background: var(--key-bg);
    border: 1px solid var(--key-line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 3px 0;
    min-width: 18px; text-align: center;
  }
  .sep { color: var(--muted); font-size: 10px; padding: 0 2px; }
  .then { display: inline-block; width: 5px; }
  .note { color: var(--muted); font-size: 10px; margin-top: 2px; break-inside: avoid; }
  kbd { flex-shrink: 0; }
  body.win .row { grid-template-columns: 8.6rem 1fr; } /* "Ctrl"/"Alt" are wider than symbols */
  .toggle { display: inline-flex; border: 1px solid var(--key-line); border-radius: 5px; overflow: hidden; }
  .toggle button {
    font: 600 10.5px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--muted); background: transparent; border: 0; padding: 3px 8px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { color: var(--key-text); background: var(--key-bg); }
  nav.sheets { margin-left: auto; display: flex; gap: 4px; }
  nav.sheets a {
    font: 600 10.5px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--muted); text-decoration: none;
    border: 1px solid var(--key-line); border-radius: 5px; padding: 3px 8px;
  }
  nav.sheets a:hover { color: var(--key-text); background: var(--key-bg); }
</style>
</head>
<body>
<header>
  <h1>GNU nano keys</h1>
  <div class="toggle" role="group" aria-label="Keyboard">
    <button type="button" data-os="mac">Mac</button>
    <button type="button" data-os="win">Windows</button>
  </div>
  <p id="legend"></p>
  <nav class="sheets" aria-label="Other cheatsheets"><a href="iterm2-cheatsheet.html">iTerm2</a><a href="vim-cheatsheet.html">Vim</a></nav>
</header>
<main id="sheet"></main>

<script>
// [title, accent, note, rows, footnote, os]; row = [keys, label]. os = "mac" shows a section on Mac only.
// Keys are written with Mac symbols; the Windows view swaps them for key names.
// Keys: " / " separates alternatives; a single space separates keys pressed in sequence.
// A row that is itself a list of rows is drawn as a boxed group of related keys.
const SECTIONS = [
  ["Files", "--a", "", [
    [["⌃S", "Save"], ["⌃O", "Save as…"]],
    ["⌃R", "Insert a file"],
    ["⌃X", "Close buffer / exit"],
  ]],
  ["Cut, copy & paste", "--b", "", [
    ["⌥A", "Set / unset mark (select)"],
    [["⌃K", "Cut line or marked region"], ["⌥6", "Copy line or marked region"], ["⌃U", "Paste"]],
    ["⌥T", "Cut to end of buffer"],
  ]],
  ["Edit", "--c", "", [
    [["⌥U", "Undo"], ["⌥E", "Redo"]],
    [["⇥", "Indent marked region"], ["⇧⇥", "Unindent marked region"]],
    ["⌥3", "Comment / uncomment"],
    ["⌃]", "Complete current word"],
    ["⌥V", "Type next key verbatim"],
    [["⌥:", "Start / stop macro"], ["⌥;", "Replay macro"]],
  ]],
  ["Delete", "--d", "", [
    [["⌃H", "Char before cursor"], ["⌃D", "Char under cursor"]],
    [["⌥⌫", "Word to the left"], ["⌃⌦", "Word to the right"]],
    ["⌥⌦", "Current line"],
  ]],
  ["Search & replace", "--e", "", [
    [["⌃F", "Search forward"], ["⌃B", "Search backward"]],
    [["⌥F", "Next match"], ["⌥B", "Previous match"]],
    ["⌥R", "Replace"],
  ]],
  ["Move", "--f", "", [
    [["⌃A", "Line start"], ["⌃E", "Line end"]],
    [["⌃P", "Line up"], ["⌃N", "Line down"]],
    [["⌃←", "Word back"], ["⌃→", "Word forward"]],
    [["⌃↑", "Previous block"], ["⌃↓", "Next block"]],
    [["⌃Y", "Page up"], ["⌃V", "Page down"]],
    [["⌥\\", "Top of buffer"], ["⌥/", "End of buffer"]],
    [["⌥Home", "First row on screen"], ["⌥End", "Last row on screen"]],
    ["⌥G", "Go to line"],
    ["⌥]", "Matching bracket"],
    ["⌃L", "Center current line"],
  ]],
  ["View & buffers", "--g", "", [
    [["⌥←", "Previous buffer"], ["⌥→", "Next buffer"]],
    [["⌥↑", "Scroll up"], ["⌥↓", "Scroll down"]],
    [["⌥<", "Scroll left"], ["⌥>", "Scroll right"]],
    ["⌥N", "Line numbers"],
    ["⌥S", "Soft wrap"],
    ["⌥P", "Show whitespace"],
    ["⌥C", "Constant cursor position"],
    [["⌥X", "Hide help lines"], ["⌥Z", "Hide info bars"]],
  ]],
  ["Tools & info", "--h", "", [
    ["⌃T", "Execute a command"],
    [["⌃T ⌃S", "Spell check"], ["⌃T ⌃Y", "Syntax check"], ["⌃T ⌃O", "Run formatter"]],
    [["⌃J", "Justify paragraph"], ["⌥J", "Justify whole buffer"]],
    [["⌃C", "Cursor position"], ["⌥D", "Line / word / char counts"]],
    ["⌃G", "Help"],
  ]],
  ["Built-in macOS nano", "--l", "UW Pico 5.09", [
    [["⌃O", "Write out"], ["⌃R", "Read file"], ["⌃X", "Exit"]],
    [["⌃K", "Cut text"], ["⌃U", "Uncut text"]],
    [["⌃Y", "Previous page"], ["⌃V", "Next page"]],
    [["⌃W", "Where is (search)"], ["⌃C", "Cursor position"]],
    [["⌃J", "Justify"], ["⌃T", "Spell check"]],
    ["⌃G", "Help"],
  ], "/usr/bin/nano on macOS is Pico, not GNU nano: only these keys are listed in its menu. For the keys above, brew install nano.", "mac"],
];

const LEGEND = {
  mac: "nano 8.x defaults · ⌃ ctrl · ⌥ option as meta (iTerm2: Profiles › Keys › Left Option = Esc+), or esc then the key · ⇧ shift · ⇥ tab · ⌫ delete · ⌦ fn-delete",
  win: "nano 8.x defaults · Alt keys can also be typed as Esc, then the key",
};
const WIN = { "⌃": "Ctrl", "⌥": "Alt", "⇧": "Shift", "⇥": "Tab", "⌫": "Bksp", "⌦": "Del" };

let os = "mac";
const MODS = "⌃⌥⇧⌘";
const split = k => { let i = 0; while (i < k.length && MODS.includes(k[i])) i++; return [[...k.slice(0, i)], k.slice(i)]; };
const box = k => `<kbd>${esc(os === "win" ? WIN[k] || k : k)}</kbd>`;
const SEP = '<span class="sep">/</span>', THEN = '<span class="then"></span>';
const chord = t => { const [m, k] = split(t); return [...m, k].filter(Boolean).map(box).join(""); };
const renderKeys = keys => keys.split(" / ").map(a => a.split(" ").map(chord).join(THEN)).join(SEP);
const renderRow = ([keys, label]) => `<div class="row">
      <span class="keys">${renderKeys(keys)}</span>
      <span class="label">${esc(label)}</span></div>`;
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
function render() {
  document.body.classList.toggle("win", os === "win");
  document.getElementById("legend").textContent = LEGEND[os];
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", b.dataset.os === os));
  document.getElementById("sheet").innerHTML = SECTIONS
    .filter(s => !s[5] || s[5] === os)
    .map(([title, accent, note, rows, foot]) => `
  <section style="--accent: var(${accent})">
    <h2>${esc(title)}${note ? ` <small>${esc(note)}</small>` : ""}</h2>
    ${rows.map(r => Array.isArray(r[0])
      ? `<div class="group">${r.map(renderRow).join("")}</div>`
      : renderRow(r)).join("")}
    ${foot ? `<p class="note">${esc(foot)}</p>` : ""}
  </section>`).join("");
}

// Start from the saved choice, else guess from the browser; remember clicks.
try { os = localStorage.getItem("nano-os") || ""; } catch {}
if (!["mac", "win"].includes(os)) os = /Mac|iPhone|iPad/.test(navigator.platform) ? "mac" : "win";
document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  os = b.dataset.os;
  try { localStorage.setItem("nano-os", os); } catch {}
  render();
}));
render();
</script>
</body>
</html>

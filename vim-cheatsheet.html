<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vim Keys</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #161a21;
    --line: #232934;
    --text: #c9d1dc;
    --muted: #7d8794;
    --key-bg: #222833;
    --key-line: #313948;
    --key-text: #e8edf3;
    --a: #7aa2f7; /* modes */
    --b: #9ece6a; /* move */
    --c: #e0af68; /* edit */
    --d: #bb9af7; /* operators */
    --e: #7dcfff; /* search */
    --f: #ff9e64; /* files */
    --g: #73daca; /* windows */
    --h: #f7768e; /* registers & macros */
    --l: #c0caf5; /* insert mode */
    --m: #e6c07b; /* settings */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 11.5px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: 10px 16px 12px;
  }
  header {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  h1 { font-size: 14px; font-weight: 650; color: var(--key-text); letter-spacing: .2px; }
  header p { color: var(--muted); font-size: 11px; }
  main { columns: 17rem; column-gap: 18px; column-rule: 1px solid var(--line); }
  h2 {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px;
    color: var(--accent); padding: 2px 0 3px; margin: 0 0 2px;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    break-after: avoid;
  }
  section { break-inside: avoid; padding-bottom: 8px; }
  h2 small { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .row {
    display: grid; grid-template-columns: 8.6rem 1fr; column-gap: 8px; align-items: center;
    padding: 1px 0; break-inside: avoid;
  }
  .group {
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    border-radius: 5px;
    padding: 1px 4px; margin: 1px -4px;
    break-inside: avoid;
  }
  .keys { white-space: nowrap; display: flex; gap: 2px; align-items: center; }
  .label { min-width: 0; }
  kbd {
    font: 12.5px/1 "SF Mono", ui-monospace, Menlo, monospace;
    color: var(--key-text);
    background: var(--key-bg);
    border: 1px solid var(--key-line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 3px 0;
    min-width: 18px; text-align: center;
  }
  .sep { color: var(--muted); font-size: 10px; padding: 0 2px; }
  .then { display: inline-block; width: 5px; }
  .note { color: var(--muted); font-size: 10px; margin-top: 2px; break-inside: avoid; }
  nav.sheets { margin-left: auto; display: flex; gap: 4px; }
  nav.sheets a {
    font: 600 10.5px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--muted); text-decoration: none;
    border: 1px solid var(--key-line); border-radius: 5px; padding: 3px 8px;
  }
  nav.sheets a:hover { color: var(--key-text); background: var(--key-bg); }
</style>
</head>
<body>
<header>
  <h1>Vim keys</h1>
  <p>Vim 9.1 (macOS vi) · normal mode unless noted · ⌃ ctrl · ↩ return · N = count · {m} = motion · x = any letter</p>
  <nav class="sheets" aria-label="Other cheatsheets"><a href="iterm2-cheatsheet.html">iTerm2</a><a href="nano-cheatsheet.html">nano</a></nav>
</header>
<main id="sheet"></main>

<script>
// [title, accent, note, rows, footnote]; row = [keys, label].
// Keys: " / " separates alternatives; a single space separates keys pressed in sequence.
// A row that is itself a list of rows is drawn as a boxed group of related keys.
const SECTIONS = [
  ["Modes", "--a", "", [
    [["i", "Insert before cursor"], ["a", "Insert after cursor"]],
    [["I", "Insert at line start"], ["A", "Insert at line end"]],
    [["o", "New line below"], ["O", "New line above"]],
    ["R", "Replace (overtype) mode"],
    [["v", "Visual (chars)"], ["V", "Visual (lines)"], ["⌃V", "Visual (block)"]],
    [[":", "Command line"], ["esc", "Back to normal mode"]],
  ]],
  ["Save & quit", "--f", "", [
    [[":w", "Save"], [":w file", "Save as"]],
    [[":wq / :x / ZZ", "Save and quit"], [":q", "Quit"], [":q! / ZQ", "Quit without saving"]],
    [[":e file", "Open file"], [":e!", "Reload, drop changes"]],
    [":r file", "Insert file below cursor"],
    [":r !cmd", "Insert command output"],
  ]],
  ["Move", "--b", "", [
    ["h j k l", "Left, down, up, right"],
    [["w / b", "Next / previous word"], ["e", "End of word"], ["W B E", "Same, by WORD (space-split)"]],
    [["0", "Line start"], ["^", "First non-blank"], ["$", "Line end"]],
    [["gg", "First line"], ["G", "Last line"], ["NG / :N", "Line N"]],
    [["fx / Fx", "To next / prev x on line"], ["tx / Tx", "Until next / prev x"], ["; / ,", "Repeat f/t, forward / back"]],
    ["%", "Matching bracket"],
    [["{ / }", "Previous / next paragraph"]],
    [["H M L", "Top, middle, bottom of screen"]],
    [["⌃U / ⌃D", "Half page up / down"], ["⌃B / ⌃F", "Page up / down"]],
    [["zz", "Center cursor line"]],
    [["⌃O / ⌃I", "Jump back / forward"], ["``", "Back to last jump"]],
  ]],
  ["Edit", "--c", "", [
    [["x", "Delete char"], ["r x", "Replace char with x"], ["~", "Toggle case"]],
    [["dd", "Delete line"], ["D", "Delete to line end"]],
    [["cc", "Change line"], ["C", "Change to line end"], ["s", "Change char"]],
    [["yy", "Copy (yank) line"], ["p / P", "Paste after / before"]],
    [["u", "Undo"], ["⌃R", "Redo"], [".", "Repeat last change"]],
    ["J", "Join line below"],
    [[">> / <<", "Indent / unindent line"], ["==", "Auto-indent line"]],
    ["⌃A / ⌃X", "Increment / decrement number"],
  ]],
  ["Operators & text objects", "--d", "operator + motion", [
    [["d{m}", "Delete"], ["c{m}", "Change"], ["y{m}", "Yank"], ["> / <{m}", "Indent / unindent"]],
    [["dw", "Delete word"], ["d$", "Delete to line end"], ["3dd", "Delete 3 lines"]],
    [["iw / aw", "Inner / a word"], ["i\" / a\"", "Inside / around quotes"], ["i( / a(", "Inside / around ( )"], ["it / at", "Inside / around tag"], ["ip / ap", "Inside / around paragraph"]],
    [["ciw", "Change word"], ["di\"", "Delete inside quotes"], ["ya(", "Yank ( ) and contents"]],
  ]],
  ["Visual mode", "--a", "", [
    ["o", "Jump to other end"],
    [["d / y / c", "Delete / yank / change selection"], ["> / <", "Indent / unindent"]],
    ["gv", "Reselect last selection"],
    ["⌃V I text esc", "Insert on every selected line"],
  ]],
  ["Search & replace", "--e", "", [
    [["/text", "Search forward"], ["?text", "Search backward"]],
    [["n", "Next match"], ["N", "Previous match"]],
    [["*", "Next word under cursor"], ["#", "Previous word under cursor"]],
    [":noh", "Clear highlight"],
    [[":s/old/new/g", "Replace in line"], [":%s/old/new/g", "Replace in file"], [":%s/old/new/gc", "…asking each time"]],
  ]],
  ["Windows, buffers & tabs", "--g", "", [
    [[":sp / :vs", "Split / vertical split"], ["⌃W h j k l", "Focus window in direction"], ["⌃W w", "Next window"]],
    [["⌃W c", "Close window"], ["⌃W o", "Close all others"]],
    [[":ls", "List buffers"], [":bn / :bp", "Next / previous buffer"], [":b N", "Buffer N"]],
    [[":tabnew", "New tab"], ["gt / gT", "Next / previous tab"]],
  ]],
  ["Registers, macros & marks", "--h", "", [
    [["\"a y y", "Yank line into register a"], ["\"a p", "Paste from register a"]],
    [["\"+ y y", "Yank line to macOS clipboard"], ["\"+ p", "Paste from clipboard"]],
    [":reg", "List registers"],
    [["q a", "Record macro into a"], ["q", "Stop recording"], ["@a", "Play macro a"], ["@@", "Replay last macro"]],
    [["m a", "Set mark a"], ["'a", "Go to mark a's line"], ["`a", "Go to mark a exactly"]],
  ]],
  ["Insert mode", "--l", "", [
    [["⌃W", "Delete word back"], ["⌃U", "Delete to line start"]],
    [["⌃N / ⌃P", "Complete word"]],
    ["⌃O", "Run one normal command"],
    ["⌃R a", "Paste register a"],
  ]],
  ["Settings", "--m", "", [
    [[":set nu", "Line numbers"], [":set rnu", "Relative numbers"]],
    [":set paste", "Paste without auto-indent"],
    [":set hls / :set ic", "Highlight / ignore case"],
    [":syntax on", "Syntax highlighting"],
    [":h topic", "Help"],
  ], "Prefix :set no… to turn a setting off, e.g. :set nonu."],
];

const MODS = "⌃⌥⇧⌘";
const split = k => { let i = 0; while (i < k.length && MODS.includes(k[i])) i++; return [[...k.slice(0, i)], k.slice(i)]; };
const box = k => `<kbd>${esc(k)}</kbd>`;
const SEP = '<span class="sep">/</span>', THEN = '<span class="then"></span>';
const chord = t => { const [m, k] = split(t); return [...m, k].filter(Boolean).map(box).join(""); };
// An ex command (":set nu") is typed as one string, so it gets one box.
const renderKeys = keys => keys.split(" / ").map(a => a.startsWith(":") ? box(a) : a.split(" ").map(chord).join(THEN)).join(SEP);
const renderRow = ([keys, label]) => `<div class="row">
      <span class="keys">${renderKeys(keys)}</span>
      <span class="label">${esc(label)}</span></div>`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
document.getElementById("sheet").innerHTML = SECTIONS.map(([title, accent, note, rows, foot]) => `
  <section style="--accent: var(${accent})">
    <h2>${esc(title)}${note ? ` <small>${esc(note)}</small>` : ""}</h2>
    ${rows.map(r => Array.isArray(r[0])
      ? `<div class="group">${r.map(renderRow).join("")}</div>`
      : renderRow(r)).join("")}
    ${foot ? `<p class="note">${esc(foot)}</p>` : ""}
  </section>`).join("");
</script>
</body>
</html>
